<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block">
<style>body{margin:0;background:#08080C;-webkit-font-smoothing:antialiased}a{color:#C6FF3D}a:hover{color:#E2FF9A}</style>
</helmet>
<div data-screen-label="Weekly recap" style="{{ cardStyle }}">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="display:inline-flex;font:700 96px 'Space Grotesk';letter-spacing:-0.04em;color:var(--text)">r<span style="position:relative">ı<span style="position:absolute;left:50%;top:.12em;width:.22em;height:.22em;border-top:.09em solid var(--accent);border-left:.09em solid var(--accent);transform:translateX(-50%) rotate(45deg)"></span></span>vl</span>
    <span style="font:600 32px Inter;color:var(--muted);text-align:right;line-height:1.3">Week 43<br>Oct 19–25</span>
  </div>

  <div style="margin-top:150px;display:flex;flex-direction:column;gap:8px">
    <div style="font:600 40px Inter;color:var(--muted)">{{ name }} finished the week</div>
    <div style="display:flex;align-items:flex-start;gap:12px"><span style="font:700 120px/1 'Space Grotesk';color:var(--accent);margin-top:60px">#</span><span style="font:700 520px/0.8 'Space Grotesk';letter-spacing:-0.06em;color:var(--accent);font-variant-numeric:tabular-nums">{{ rank }}</span></div>
    <div style="font:600 48px Inter;margin-top:24px">of 7 rivals</div>
  </div>

  <div style="margin-top:96px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div style="padding:40px;border-radius:40px;background:var(--surface);border:2px solid var(--border)"><div style="font:600 32px Inter;color:var(--muted)">Points</div><div style="font:700 128px/1 'Space Grotesk';font-variant-numeric:tabular-nums;margin-top:16px">{{ points }}</div></div>
    <div style="padding:40px;border-radius:40px;background:var(--surface);border:2px solid var(--border)"><div style="font:600 32px Inter;color:var(--muted)">Streak</div><div style="display:flex;align-items:center;gap:12px;margin-top:16px"><span style="font-family:'Material Symbols Rounded';font-size:112px;line-height:1;font-variation-settings:'FILL' 1;background:linear-gradient(0deg,#FF7A1A,#FFC93D);-webkit-background-clip:text;background-clip:text;color:transparent">local_fire_department</span><span style="font:700 128px/1 'Space Grotesk';font-variant-numeric:tabular-nums">{{ streak }}</span></div></div>
    <div style="grid-column:1 / -1;padding:40px;border-radius:40px;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;gap:32px">
      <div style="flex:1"><div style="font:600 32px Inter;color:var(--muted)">Top task</div><div style="font:700 56px/1.15 'Space Grotesk';margin-top:12px;text-wrap:pretty">{{ topTask }}</div></div>
      <span style="background:var(--accent);color:#0B0B10;font:700 56px 'Space Grotesk';padding:12px 32px;border-radius:999px;font-variant-numeric:tabular-nums">+{{ topPts }}</span>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end">
    <div style="font:700 56px/1.1 'Space Grotesk';max-width:620px;text-wrap:pretty">Get it done. Beat your friends.</div>
    <div style="font:700 56px 'Space Grotesk';color:var(--accent)">rivl.app</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Volt&quot;,&quot;Pulse&quot;,&quot;Ice&quot;,&quot;Blaze&quot;,&quot;Nova&quot;,&quot;Gold&quot;],&quot;default&quot;:&quot;Volt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dark&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rank&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:9,&quot;tsType&quot;:&quot;number&quot;},&quot;points&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:515,&quot;tsType&quot;:&quot;number&quot;},&quot;streak&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;tsType&quot;:&quot;number&quot;}}">
const ACC={Volt:'#C6FF3D',Pulse:'#FF3D8B',Ice:'#3DE1FF',Blaze:'#FF7A1A',Nova:'#9B5CFF',Gold:'#FFC93D'};
class Component extends DCLogic {
  renderVals(){
    const P=this.props,light=P.mode==='Light',a=ACC[P.accent]||ACC.Volt;
    const v=light?{'--bg':'#F6F6F9','--surface':'#FFFFFF','--border':'#DCDCE6','--text':'#111118','--muted':'#5E5E72'}:{'--bg':'#0B0B10','--surface':'#15151D','--border':'#2A2A38','--text':'#F4F4F8','--muted':'#9A9AB0'};
    return{cardStyle:{...v,'--accent':a,width:1080,height:1920,boxSizing:'border-box',padding:'96px 88px',background:'var(--bg)',color:'var(--text)',display:'flex',flexDirection:'column',fontFamily:'Inter,sans-serif',overflow:'hidden'},
      name:P.name??'Dami',rank:P.rank??2,points:P.points??515,streak:P.streak??13,topTask:P.topTask??'Finish pitch deck v2',topPts:P.topPts??50};
  }
}
</script>
</body>
</html>
